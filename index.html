<form>

    <h3>Đăng ký ứng tuyển TechTalent</h3>
<fieldset> Thông tin cá nhân: <br>
    <label>Họ và tên: <input type="text" name="fullName" placeholder="Nhập tên" required></label> <br>
    <label>Mật khẩu hệ thống: <input type="password" name="password" placeholder="Tạo mật khẩu" required></label> <br>
    <label>Email liên hệ: <input type="email" name="email" placeholder="Nhập email" required></label> <br>
    Giới tính:
   <label> Nam <input type="radio" name="gender" value="male"></label>
   <label> Nữ <input type="radio" name="gender" value="female"></label> <br>
    Ngày sinh (dd/mm/yyyy): <input type="date" name="birthDate"> </label> <br>
</fieldset>
<fieldset> Thông tin chuyên môn: <br>
   <label> Vị trí ứng tuyển: <input type="text" name="position" required></label> <br>
    <label>Nộp CV (Định dạng PDF): <input type="file" name="cv" accept=".pdf" required></label> <br>
</fieldset>
    <button>Gửi Hồ Sơ</button>

</form>
